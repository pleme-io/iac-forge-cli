[package]
name = "iac-forge-cli"
version = "0.1.3"
edition = "2024"
rust-version = "1.89.0"
description = "Unified CLI for generating IaC providers from OpenAPI specs"
homepage = "https://github.com/pleme-io/iac-forge-cli"
repository = "https://github.com/pleme-io/iac-forge-cli"
readme = "README.md"
license = "MIT"
categories = ["command-line-utilities", "development-tools"]
keywords = ["iac", "codegen", "openapi", "terraform", "pulumi"]

[[bin]]
name = "iac-forge"
path = "src/main.rs"

[lints.clippy]
pedantic = "warn"

[features]
default = ["terraform", "pulumi", "crossplane", "ansible", "steampipe", "helm"]
terraform = ["dep:terraform-forge"]
pulumi = ["dep:pulumi-forge"]
crossplane = ["dep:crossplane-forge"]
ansible = ["dep:ansible-forge"]
steampipe = ["dep:steampipe-forge"]
helm = ["dep:helm-forge"]
# `pangea` feature removed: pangea-forge is a private repo with a missing
# `arch-synthesizer` transitive dep; cargo can't resolve it from public CI
# runners and it's been broken upstream for the duration of this release
# train. Restore once pangea-forge is reachable + buildable.

[dependencies]
openapi-forge = { git = "https://github.com/pleme-io/openapi-forge" }
iac-forge = { git = "https://github.com/pleme-io/iac-forge" }
terraform-forge = { git = "https://github.com/pleme-io/terraform-forge", optional = true }
pulumi-forge = { git = "https://github.com/pleme-io/pulumi-forge", optional = true }
crossplane-forge = { git = "https://github.com/pleme-io/crossplane-forge", optional = true }
ansible-forge = { git = "https://github.com/pleme-io/ansible-forge", optional = true }
steampipe-forge = { git = "https://github.com/pleme-io/steampipe-forge", optional = true }
helm-forge = { git = "https://github.com/pleme-io/helm-forge", optional = true }
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
colored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
glob = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
