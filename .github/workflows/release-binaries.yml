name: release-binaries

# Thin wrapper around substrate/.github/workflows/rust-binary-release.yml.
# On every `v*` tag push, build the iac-forge binary for 4 platforms and
# attach it to the GitHub Release that softprops/action-gh-release creates.

on:
  push:
    tags: ['v*']

jobs:
  binaries:
    uses: pleme-io/substrate/.github/workflows/rust-binary-release.yml@main
    with:
      binary-name: iac-forge
      # Ansible-only first release. The other sibling forges (helm-forge,
      # pulumi-forge, etc.) currently have upstream compile errors against
      # the latest iac-forge IR variants (non-exhaustive IacType handling)
      # and pangea-forge is private + has an unreachable transitive dep.
      # The pleme-io/actions/iac-forge action's `backend:` input accepts
      # all values but the binary only honors `ansible` until the sibling
      # forges are fixed and this `features:` list is broadened.
      features: ansible
      no-default-features: true
